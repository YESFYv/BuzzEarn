<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuzzEarn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;}
body{background:#f5f5ff;padding-bottom:80px;}
.header{background:#6c5ce7;color:white;padding:18px 20px 28px;border-radius:0 0 24px 24px;}
.header h2{font-size:20px;} .header p{font-size:13px;opacity:.9;margin-top:2px;}
.balance-card{background:white;border-radius:16px;padding:16px 18px;margin:14px 16px 0;box-shadow:0 4px 12px rgba(108,92,231,.15);}
.balance-card h1{font-size:32px;font-weight:800;margin:4px 0;}
.balance-card small,.balance-card span{font-size:11px;color:#888;}
.stats{display:flex;gap:12px;margin:12px 16px;}
.stat-box{flex:1;background:white;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.task-section{padding:10px 16px;}
.task{background:white;display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.task-left b{font-size:13.5px;display:block;} .task-left small{font-size:11px;color:#6c5ce7;background:#f0eeff;padding:2px 6px;border-radius:20px;display:inline-block;margin-top:3px;}
.btn-go{background:#6c5ce7;color:white;border:none;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-go.done{background:#00b894;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0 14px;}
.nav-item{text-align:center;font-size:11px;color:#999;flex:1;} .nav-item.active{color:#6c5ce7;font-weight:700;} .nav-item span{font-size:20px;display:block;}
</style>
</head>
<body>
<div class="header"><h2>BuzzEarn</h2><p>Welcome, Adewuyi Yusuf 👋</p></div>
<div class="balance-card"><small>Available Balance</small><h1 id="balance">N0</h1><span>Min withdrawal N2000</span></div>
<div class="stats"><div class="stat-box"><small>Tasks Done</small><b id="done">0 / 100</b></div><div class="stat-box"><small>Earned Today</small><b id="earned">N0</b></div></div>
<div class="task-section"><h3>Tasks N50/N100</h3><div id="taskList"></div></div>
<div class="bottom-nav"><div class="nav-item active"><span>🏠</span>Dashboard</div><div class="nav-item"><span>📋</span>Tasks</div><div class="nav-item"><span>👤</span>Profile</div></div>
<script>
const tasks=[["Follow IG Page","N100"],["Like TikTok","N100"],["Subscribe YouTube","N100"],["Comment FB","N100"],["Share WhatsApp Status","N50"],["Watch 60s Video","N50"],["Daily Bonus","N100"],["Join Telegram","N50"],["Retweet X","N50"],["Like FB Page","N100"],["View Ad 30s","N50"],["Follow Twitter","N50"],["Comment YouTube","N50"],["Share FB Post","N50"],["Watch TikTok","N100"],["Rate App 5 Star","N50"],["Invite Test","N100"],["Complete Survey","N100"],["Click Ads","N100"],["Play Game Ad","N100"]];
let bal=0,doneCount=0;const list=document.getElementById('taskList');
tasks.forEach((t,i)=>{const d=document.createElement('div');d.className='task';d.innerHTML=`<div class="task-left"><b>${t[0]}</b><small>${t[1]}</small></div><button class="btn-go" id="btn${i}" onclick="doTask(${i},'${t[1]}')">Go</button>`;list.appendChild(d);});
function doTask(i,r){const btn=document.getElementById('btn'+i);if(btn.classList.contains('done'))return;let a=parseInt(r.replace('N',''));bal+=a;doneCount++;document.getElementById('balance').innerText='N'+bal;document.getElementById('earned').innerText='N'+bal;document.getElementById('done').innerText=doneCount+' / 100';btn.innerText='Done';btn.classList.add('done');}
</script>
</body>
</html>
